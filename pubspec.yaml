name: homepage_v2
description: "A portfolio presented as an interactive space map."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.14.0
  flutter: '>=3.50.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_web_plugins:
    sdk: flutter
  go_router: ^18.1.3
  material_ui: ^1.10.0
  riverpod: ^3.4.3
  vector_math: ^2.4.0
  web: ^1.1.2
  web_address_bar: ^0.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  args: ^2.7.0
  flutter_lints: ^6.0.0
  html: ^0.15.7
  puppeteer: ^3.28.0
  shelf: ^1.4.3
  shelf_static: ^1.2.0

flutter:
  uses-material-design: true
  shaders:
    - shaders/scene.frag
    - shaders/kepler_textures.frag
    - shaders/hole_textures.frag
    - shaders/sky_cache.frag
  assets:
    - LICENSES/
  fonts:
    - family: Saira
      fonts:
        - asset: fonts/Saira.ttf
    - family: Atkinson Hyperlegible Next
      fonts:
        - asset: fonts/AtkinsonHyperlegibleNext.ttf
    # Flutter web draws text in Roboto when the text's own family is
    # missing, and downloads Roboto at start-up unless a family has that
    # name. This one is Atkinson's file.
    - family: Roboto
      fonts:
        - asset: fonts/AtkinsonHyperlegibleNext.ttf
