name: homepage_v2
description: "A portfolio presented as an interactive space map."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_web_plugins:
    sdk: flutter
  go_router: ^18.1.3
  material_ui: ^1.10.0
  riverpod: ^3.4.3
  vector_math: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  shaders:
    - shaders/scene.frag
